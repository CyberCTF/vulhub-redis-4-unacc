# Inputs (optional, unset ones are empty): kubectl -n isoloom-vulhub-redis-4-unacc create secret generic isoloom-inputs --from-literal=CTF_FLAG_MAIN=…

apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-vulhub-redis-4-unacc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: redis
  template:
    metadata:
      labels:
        isoloom.com/machine: redis
        net.isoloom.com/lab: member
    spec:
      hostname: redis
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: redis
        image: vulhub/redis:4.0.14
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: CTF_FLAG_MAIN
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_MAIN
              optional: true
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: vol-ctf
          mountPath: /ctf
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      - name: init
        image: vulhub/redis:4.0.14
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 6379; do sleep 2; done && sh /isoloom/scripts/ctf__flag.sh && exec sleep infinity
        env:
        - name: CTF_FLAG_MAIN
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_MAIN
              optional: true
        volumeMounts:
        - name: vol-ctf
          mountPath: /ctf
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-ctf
        persistentVolumeClaim:
          claimName: redis-ctf
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-ctf
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    isoloom.com/machine: redis
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-published
spec:
  type: LoadBalancer
  selector:
    isoloom.com/machine: redis
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: publish-redis
spec:
  podSelector:
    matchLabels:
      isoloom.com/machine: redis
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isoloom-default-deny
spec:
  podSelector: {}
  policyTypes:
  - Ingress
